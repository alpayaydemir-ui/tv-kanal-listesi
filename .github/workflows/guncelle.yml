name: Kanal listesini güncelle

on:
  schedule:
    - cron: "17 14 * * *"  # her gün 17:17 (Türkiye saati)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Listeyi üret
        run: python3 -I guncelle.py
      - name: Değiştiyse kaydet
        run: |
          if git diff --quiet -- turkiye-ucretsiz.m3u; then
            echo "Değişiklik yok."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add turkiye-ucretsiz.m3u
          git commit -m "Kanal listesini güncelle ($(date -u +%Y-%m-%d))"
          git push
